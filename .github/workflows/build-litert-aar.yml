name: Build LiteRT AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: litert-1.4.1-patch
          submodules: recursive

      - name: Build Docker image
        run: |
          docker build \
            -t litert_build_env \
            -f ci/tflite-android.Dockerfile \
            ci/

      - name: Build AAR
        run: |
          docker run --rm \
            -w /litert_build \
            -v "$PWD:/litert_build" \
            -e TF_SET_ANDROID_WORKSPACE=1 \
            -e ANDROID_SDK_HOME=/android/sdk \
            -e ANDROID_SDK_API_LEVEL=35 \
            -e ANDROID_BUILD_TOOLS_VERSION=35.0.1 \
            -e ANDROID_NDK_HOME=/android/ndk \
            -e ANDROID_NDK_API_LEVEL=21 \
            -e CC_OPT_FLAGS="-Wno-sign-compare" \
            -e PYTHON_BIN_PATH=/usr/bin/python3 \
            -e PYTHON_LIB_PATH=/usr/lib/python3/dist-packages \
            -e TF_NEED_CUDA=0 \
            -e TF_NEED_ROCM=0 \
            -e TF_DOWNLOAD_CLANG=0 \
            -e TF_NEED_CLANG=0 \
            -e TF_CONFIGURE_IOS=0 \
            -e USE_LOCAL_TF=true \
            -e TF_LOCAL_SOURCE_PATH=/litert_build/third_party/tensorflow \
            litert_build_env \
            bash -lc '
              cd /litert_build/third_party/tensorflow && \
              yes "" | ./configure && \
              cp .tf_configure.bazelrc /litert_build/ && \
              cd /litert_build && \
              bazel build -c opt --cxxopt=--std=c++17 \
                --config=android \
                --fat_apk_cpu=x86,x86_64,arm64-v8a,armeabi-v7a \
                --define=android_dexmerger_tool=d8_dexmerger \
                --define=android_incremental_dexing_tool=d8_dexbuilder \
                //tflite/java:tensorflow-lite
            '

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: tensorflow-lite-aar-v1.4.1
          path: bazel-bin/tflite/java/*.aar
