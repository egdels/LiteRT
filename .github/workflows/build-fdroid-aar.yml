name: Build LiteRT AAR (F-Droid compatible)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      fat_apk_cpus:
        description: 'Comma-separated list of Android ABIs to build'
        required: false
        default: 'arm64-v8a,armeabi-v7a'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK & NDK
        run: |
          # Install Android command-line tools
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fSL -o /tmp/cmdline-tools.zip "$CMDLINE_TOOLS_URL"
          unzip -q /tmp/cmdline-tools.zip -d /tmp
          mv /tmp/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          rm /tmp/cmdline-tools.zip

          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.1" "platform-tools" "ndk;25.2.9519653"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Build AAR
        run: |
          chmod +x ci/build-fdroid.sh
          ./ci/build-fdroid.sh
        env:
          FAT_APK_CPUS: ${{ inputs.fat_apk_cpus || 'arm64-v8a,armeabi-v7a' }}

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: tensorflow-lite-aar
          path: output/*.aar
