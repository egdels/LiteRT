name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.4.1-fdroid)'
        required: true
        default: '1.4.1-fdroid'
        type: string
      dry_run:
        description: 'Dry run — publish to local Maven repo only, skip Sonatype'
        required: false
        default: true
        type: boolean
      build_run_id:
        description: 'Run ID of the build workflow (leave empty to use latest successful)'
        required: false
        default: ''
        type: string
      staging_only:
        description: 'Upload to Sonatype staging only — do NOT release (allows manual review in portal)'
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Determine which build workflow run to download the artifact from.
      # Priority: 1) explicit input  2) latest successful run
      - name: Resolve build run ID
        id: resolve-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.build_run_id }}" ]; then
            echo "run_id=${{ inputs.build_run_id }}" >> "$GITHUB_OUTPUT"
            echo "==> Using explicitly provided run ID: ${{ inputs.build_run_id }}"
          else
            # Find the latest successful run of the build workflow
            RUN_ID=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/build-fdroid-aar.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id')
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "::error::No successful build workflow run found."
              exit 1
            fi
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "==> Using latest successful build run ID: $RUN_ID"
          fi

      - name: Download AAR artifact
        uses: actions/download-artifact@v4
        with:
          name: tensorflow-lite-aar
          path: output/
          run-id: ${{ steps.resolve-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify AAR exists
        run: |
          ls -la output/tensorflow-lite.aar
          sha256sum output/tensorflow-lite.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central
        if: ${{ !inputs.dry_run && !inputs.staging_only }}
        working-directory: publish
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
        env:
          AAR_VERSION: ${{ inputs.version || '1.4.1-fdroid' }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish to Sonatype staging (review in portal before release)
        if: ${{ inputs.staging_only }}
        working-directory: publish
        run: |
          ./gradlew publishToSonatype closeSonatypeStagingRepository
          echo "==> Artifacts uploaded and staging repository closed."
          echo "==> Review at https://central.sonatype.com → Deployments, then Publish or Drop."
        env:
          AAR_VERSION: ${{ inputs.version || '1.4.1-fdroid' }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Dry run — publish to local Maven repo
        if: ${{ inputs.dry_run }}
        working-directory: publish
        run: |
          ./gradlew publishToMavenLocal
          echo "=== Published artifacts ==="
          find ~/.m2/repository/de/schliweb -type f | sort
        env:
          AAR_VERSION: ${{ inputs.version || '1.4.1-fdroid' }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload Maven artifacts for inspection
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: maven-local-artifacts
          path: ~/.m2/repository/de/schliweb/
          retention-days: 7
