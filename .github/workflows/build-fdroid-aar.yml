name: Build LiteRT AAR (F-Droid compatible)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      fat_apk_cpus:
        description: 'Comma-separated list of Android ABIs to build'
        required: false
        default: 'arm64-v8a,armeabi-v7a,x86_64,x86'
        type: string
      fdroid_strict:
        description: 'Run in FDROID_BUILD=1 strict mode (two-phase build)'
        required: false
        default: true
        type: boolean

# Pinned versions — keep in sync with ci/build-fdroid.sh
env:
  PINNED_SDK_API_LEVEL: '35'
  PINNED_BUILD_TOOLS: '35.0.1'
  PINNED_NDK_VERSION: '25.2.9519653'
  BAZEL_VERSION: '7.4.1'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------------------------------------------------------------
      # Install Bazel directly (not Bazelisk) — matches F-Droid sudo:
      # ---------------------------------------------------------------
      - name: Install Bazel ${{ env.BAZEL_VERSION }}
        run: |
          BAZEL_URL="https://github.com/bazelbuild/bazel/releases/download/${{ env.BAZEL_VERSION }}/bazel-${{ env.BAZEL_VERSION }}-linux-x86_64"
          sudo curl -fSL -o /usr/local/bin/bazel "$BAZEL_URL"
          sudo chmod +x /usr/local/bin/bazel
          bazel --version

      # ---------------------------------------------------------------
      # Install Android SDK & NDK with exact pinned versions
      # ---------------------------------------------------------------
      - name: Install Android SDK & NDK
        run: |
          # Pin cmdline-tools version and verify integrity
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          CMDLINE_TOOLS_SHA256="7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee"
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fSL -o /tmp/cmdline-tools.zip "$CMDLINE_TOOLS_URL"
          echo "${CMDLINE_TOOLS_SHA256}  /tmp/cmdline-tools.zip" | sha256sum -c -
          unzip -q /tmp/cmdline-tools.zip -d /tmp
          mv /tmp/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          rm /tmp/cmdline-tools.zip

          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-${PINNED_SDK_API_LEVEL}" \
            "build-tools;${PINNED_BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${PINNED_NDK_VERSION}"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${PINNED_NDK_VERSION}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # Phase 1: Generate repository cache (with network)
      # Only needed for FDROID_BUILD=1 strict mode
      # ---------------------------------------------------------------
      - name: 'Phase 1: Generate Bazel repository cache'
        if: ${{ inputs.fdroid_strict != false }}
        run: |
          export USE_LOCAL_TF=true
          export TF_LOCAL_SOURCE_PATH="$GITHUB_WORKSPACE/third_party/tensorflow"
          export ANDROID_SDK_HOME="$ANDROID_HOME"

          # Use the canonical F-Droid bazelrc
          cp ci/tf_configure.bazelrc.fdroid .tf_configure.bazelrc

          CACHE_DIR="$RUNNER_TEMP/bazel-repo-cache"
          mkdir -p "$CACHE_DIR"

          # Use the same --output_user_root that Phase 2 will use.
          # This ensures Phase 2 can reuse the exact output base (including
          # repos resolved via ctx.download() that aren't in --repository_cache).
          BAZEL_OUTPUT_ROOT="/tmp/bazel-output-root"
          mkdir -p "$BAZEL_OUTPUT_ROOT"

          info() { echo "==> $*"; }

          # Patch all workspace files that pin XNNPACK to the correct version
          for XNNPACK_BZL in \
            "$TF_LOCAL_SOURCE_PATH/third_party/xla/third_party/tsl/workspace2.bzl" \
            "$TF_LOCAL_SOURCE_PATH/tensorflow/workspace2.bzl"; do
            if [ -f "$XNNPACK_BZL" ]; then
              info "Patching XNNPACK version in $XNNPACK_BZL..."
              sed -i \
                -e 's|a50369c0fdd15f0f35b1a91c964644327a88d480|e757940dbdcf465fd9eb7901ce73f4ff21387663|g' \
                -e 's|ca3a5316b8161214f8f22a578fb638f1fccd0585eee40301363ffd026310379a|eb01826f3820284b89076e94e4458a7326dc6986bdaf5cdc61bb2f26db12aab1|g' \
                -e 's|9ddeb74f9f6866174d61888947e4aa9ffe963b1b|e757940dbdcf465fd9eb7901ce73f4ff21387663|g' \
                -e 's|0e5d5c16686beff813e3946b26ca412f28acaf611228d20728ffb6479264fe19|eb01826f3820284b89076e94e4458a7326dc6986bdaf5cdc61bb2f26db12aab1|g' \
                -e 's|b8374f80e42010941bda6c85b0e3f1a1bd77a1e0|c2ba5c50bb58d1397b693740cf75fad836a0d1bf|g' \
                -e 's|b96413b10dd8edaa4f6c0a60c6cf5ef55eebeef78164d5d69294c8173457f0ec|516ba8d05c30e016d7fd7af6a7fc74308273883f857faf92bc9bb630ab6dba2c|g' \
                -e 's|4fe0e1e183925bf8cfa6aae24237e724a96479b8|c2ba5c50bb58d1397b693740cf75fad836a0d1bf|g' \
                -e 's|a4cf06de57bfdf8d7b537c61f1c3071bce74e57524fe053e0bbd2332feca7f95|516ba8d05c30e016d7fd7af6a7fc74308273883f857faf92bc9bb630ab6dba2c|g' \
                -e 's|5e63739504f0f8e18e941bd63b2d6d42536c7d90|33ed0be77d7767d0e2010e2c3cf972ef36c7c307|g' \
                -e 's|18eca9bc8d9c4ce5496d0d2be9f456d55cbbb5f0639a551ce9c8bac2e84d85fe|b7be544ab78e16f5a89a7184c60e234fab7bbd84148da6f7a36b5a2e9759446c|g' \
                -e 's|3c8b1533ac03dd6531ab6e7b9245d488f13a82a5|33ed0be77d7767d0e2010e2c3cf972ef36c7c307|g' \
                -e 's|5d7f00693e97bd7525753de94be63f99b0490ae6855df168f5a6b2cfc452e49e|b7be544ab78e16f5a89a7184c60e234fab7bbd84148da6f7a36b5a2e9759446c|g' \
                -e 's|cddf991af5de49fd34949fa39690e4e906e04074|45bf06030727ce049793ce6749e943cc2ea896fe|g' \
                -e 's|88233e427be6579560073267575f00f3b5fc370a31a43bbdd87a1810bd4bf1b6|919683ceeedd6dd9db26c341eef448f9096616dfc4e9270e0209e481921e78e4|g' \
                -e 's|gitlab.arm.com/kleidi/kleidiai/-/archive|github.com/ARM-software/kleidiai/archive|g' \
                "$XNNPACK_BZL"
            fi
          done
          info "XNNPACK + pthreadpool + cpuinfo + KleidiAI patched."

          info "Fetching all dependencies into repository cache..."

          bazel --output_user_root="$BAZEL_OUTPUT_ROOT" fetch //tflite/java:tensorflow-lite \
            -c opt \
            --cxxopt=--std=c++17 \
            --config=android \
            --cpu=armeabi-v7a \
            --fat_apk_cpu="${{ inputs.fat_apk_cpus || 'arm64-v8a,armeabi-v7a,x86_64,x86' }}" \
            --define=android_dexmerger_tool=d8_dexmerger \
            --define=android_incremental_dexing_tool=d8_dexbuilder \
            --repo_env=HERMETIC_PYTHON_VERSION=3.12 \
            --repository_cache="$CACHE_DIR"

          echo "BAZEL_REPO_CACHE=$CACHE_DIR" >> "$GITHUB_ENV"

          # Shut down the Bazel server but do NOT clean the output base.
          # Some repository rules (e.g. go_sdk from grpc_extra_deps) use
          # ctx.download() which is NOT cached by --repository_cache.
          # These resolved repos live in the output base and must survive
          # into Phase 2 which reuses the same --output_user_root.
          # True cold-start validation must be done on a clean VM.
          bazel --output_user_root="$BAZEL_OUTPUT_ROOT" shutdown
          info "Repository cache populated at $CACHE_DIR"
          du -sh "$CACHE_DIR"

      # ---------------------------------------------------------------
      # Phase 2: Build in strict F-Droid mode (no network)
      # ---------------------------------------------------------------
      - name: 'Phase 2: Build AAR (FDROID_BUILD=1, strict mode, NO NETWORK)'
        if: ${{ inputs.fdroid_strict != false }}
        run: |
          chmod +x ci/build-fdroid.sh

          # Phase 1 used /tmp/bazel-output-root as --output_user_root,
          # so all external repos (including ctx.download() ones like go_sdk)
          # are already there.
          BAZEL_OUTPUT_ROOT="/tmp/bazel-output-root"

          # Create a bazel wrapper that injects --output_user_root BEFORE
          # the real bazel binary runs. Bazel's C++ client calls mkdir() on
          # its default output root (~/.cache/bazel/_bazel_<user>) BEFORE
          # reading .bazelrc or any flags. The only way to prevent this is
          # to pass --output_user_root on the command line, which the wrapper
          # ensures for every invocation (including --version checks).
          WRAPPER_DIR="$(mktemp -d)"
          REAL_BAZEL="$(command -v bazel)"
          printf '#!/bin/sh\nexec "%s" --output_user_root="%s" "$@"\n' \
            "$REAL_BAZEL" "$BAZEL_OUTPUT_ROOT" > "$WRAPPER_DIR/bazel"
          chmod +x "$WRAPPER_DIR/bazel"

          # Enforce no network access — simulates F-Droid's offline sandbox.
          # unshare --user --net creates a network namespace with only loopback.
          # Using --user (unprivileged user namespace) instead of sudo avoids
          # all permission issues with Bazel's output root directories.
          # --map-root-user maps the current UID/GID to root inside the
          # namespace, but filesystem access stays as the runner user.
          unshare --user --net --map-root-user -- env \
            HOME="$HOME" \
            USER="$USER" \
            PATH="$WRAPPER_DIR:$PATH" \
            JAVA_HOME="$JAVA_HOME" \
            FDROID_BUILD=1 \
            USE_LOCAL_TF=true \
            TF_LOCAL_SOURCE_PATH="$GITHUB_WORKSPACE/third_party/tensorflow" \
            ANDROID_HOME="$ANDROID_HOME" \
            ANDROID_SDK_HOME="$ANDROID_HOME" \
            ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
            BAZEL_REPO_CACHE="$BAZEL_REPO_CACHE" \
            FAT_APK_CPUS="${{ inputs.fat_apk_cpus || 'arm64-v8a,armeabi-v7a,x86_64,x86' }}" \
            BAZEL_STARTUP_ARGS="--batch" \
            ./ci/build-fdroid.sh

      # ---------------------------------------------------------------
      # Fallback: Developer mode build (no strict mode)
      # ---------------------------------------------------------------
      - name: 'Build AAR (developer mode)'
        if: ${{ inputs.fdroid_strict == false }}
        run: |
          chmod +x ci/build-fdroid.sh
          ./ci/build-fdroid.sh
        env:
          FAT_APK_CPUS: ${{ inputs.fat_apk_cpus || 'arm64-v8a,armeabi-v7a,x86_64,x86' }}
          ANDROID_SDK_API_LEVEL: ${{ env.PINNED_SDK_API_LEVEL }}
          ANDROID_BUILD_TOOLS_VERSION: ${{ env.PINNED_BUILD_TOOLS }}

      # ---------------------------------------------------------------
      # Verify output
      # ---------------------------------------------------------------
      - name: Verify AAR exists and print checksum
        run: |
          ls -la output/tensorflow-lite.aar
          sha256sum output/tensorflow-lite.aar

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: tensorflow-lite-aar
          path: output/*.aar

